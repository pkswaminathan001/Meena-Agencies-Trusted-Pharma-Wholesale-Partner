[server]
enableStaticServing = true
runOnSave = true
enableCORS = false
enableXsrfProtection = true
headless = true

[client]
toolbarMode = "viewer"
showErrorDetails = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#FFD814"
backgroundColor = "#eaeded"
secondaryBackgroundColor = "#ffffff"
textColor = "#0F1111"
font = "sans serif"
